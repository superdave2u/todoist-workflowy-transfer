[project]
name = "reference-transfer"
version = "0.1.0"
description = "Queued Todoist reference transfer to Workflowy"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project.scripts]
reference-transfer = "reference_transfer.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
